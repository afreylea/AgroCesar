<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AgroCesar — Recuperar contraseña</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-green-700 mb-2">Recuperar contraseña</h2>
    <p class="text-gray-500 mb-6">Ingresa tu email y te enviaremos un enlace para restablecer tu contraseña.</p>

    <!-- Mensaje de éxito -->
    <div th:if="${mensaje}" class="bg-green-100 text-green-700 p-3 rounded mb-4" th:text="${mensaje}"></div>

    <!-- Mensaje de error -->
    <div th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded mb-4" th:text="${error}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
            <input type="email" name="email" required
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500"
                   placeholder="tu@correo.com"/>
        </div>

        <button type="submit"
                class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 font-medium">
            Enviar enlace
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
        <a href="/login" class="text-green-600 hover:underline">Volver al login</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>
</body>
</html>
