<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-auth :: base('Login - Agrocesar', ~{::div})}">

<body>
    <div class="relative">

        <!-- Logo flotante -->
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 z-10">
            <div
                class="bg-white rounded-full p-3 shadow-xl border-4 border-green-100 w-28 h-28 flex items-center justify-center">
                <img th:src="@{~/images/logo-agrocesar.png}" alt="Logo" class="h-16 w-16 object-contain">
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8 pt-16 w-full max-w-md">

            <h1 class="text-2xl font-bold text-green-900 text-center mb-2">Iniciar sesión</h1>

            <!-- Separador decorativo con maíz -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="h-px w-12 bg-green-200"></div>

                <!-- Icono de maíz -->
                <svg class="w-7 h-7 text-yellow-500" viewBox="0 0 24 24" fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg">
                    <!-- Hoja izquierda -->
                    <path d="M12 14 Q6 12 4 16 Q8 15 12 14" fill="#16a34a" />
                    <!-- Hoja derecha -->
                    <path d="M12 14 Q18 12 20 16 Q16 15 12 14" fill="#16a34a" />
                    <!-- Hoja inferior -->
                    <path d="M12 16 Q8 18 6 20 Q10 18 12 16" fill="#16a34a" />
                    <!-- Mazorca -->
                    <ellipse cx="12" cy="8" rx="4" ry="7" fill="#eab308" />
                    <!-- Granos -->
                    <circle cx="10" cy="5" r="1.2" fill="#facc15" />
                    <circle cx="12" cy="4.5" r="1.2" fill="#facc15" />
                    <circle cx="14" cy="5" r="1.2" fill="#facc15" />
                    <circle cx="9" cy="7" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="6.5" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="6.5" r="1.2" fill="#facc15" />
                    <circle cx="15" cy="7" r="1.2" fill="#facc15" />
                    <circle cx="9" cy="9" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="8.5" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="8.5" r="1.2" fill="#facc15" />
                    <circle cx="15" cy="9" r="1.2" fill="#facc15" />
                    <circle cx="10" cy="11" r="1.2" fill="#facc15" />
                    <circle cx="12" cy="10.5" r="1.2" fill="#facc15" />
                    <circle cx="14" cy="11" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="13" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="13" r="1.2" fill="#facc15" />
                    <!-- Tallo -->
                    <rect x="11" y="14" width="2" height="6" fill="#16a34a" />
                </svg>

                <div class="h-px w-12 bg-green-200"></div>
            </div>

            <div th:if="${param.error}"
                class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Correo o contraseña incorrectos
            </div>

            <div th:if="${param.logout}"
                class="bg-green-50 text-green-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Sesión cerrada correctamente
            </div>

            <form th:action="@{/login}" method="post" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                    th:if="${_csrf != null}">

                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                        <input type="email" name="username" required placeholder="ejemplo@correo.com"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <div class="relative" x-data="{ mostrar: false }">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input :type="mostrar ? 'text' : 'password'" name="password" required
                            placeholder="Ingresa tu contraseña"
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                        <button type="button" @click="mostrar = !mostrar"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg x-show="!mostrar" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="mostrar" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="rounded border-gray-300 text-green-600 focus:ring-green-500">
                        <span class="text-gray-600">Recordarme</span>
                    </label>
                    <a href="#" class="text-green-700 hover:text-green-800 font-medium">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit"
                    class="w-full bg-green-900 text-white py-3 rounded-xl hover:bg-green-800 font-semibold transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Ingresar
                </button>

                <p class="text-center text-sm text-gray-500">
                    ¿No tienes cuenta?
                    <a th:href="@{/registro}"
                        class="text-green-700 hover:text-green-800 font-semibold hover:underline">Regístrate aquí</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
