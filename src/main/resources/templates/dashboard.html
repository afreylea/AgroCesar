<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: base('Dashboard - Agrocesar', ~{::main})"></head>

<body>
    <main>
        <!-- Saludo personalizado -->
        <h2 class="text-2xl font-bold text-green-900 mb-2" th:text="'Bienvenido, ' + ${usuario.nombre}"></h2>

        <!-- Pronóstico climático — visible solo si hay datos -->
        <div th:if="${pronostico != null}" class="mb-8">
            <h3 class="text-lg font-semibold text-gray-700 mb-3" th:text="'Pronóstico en ' + ${municipio}"></h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- th:each itera los días del pronóstico (DailyForecast) -->
                <div th:each="dia : ${pronostico}" class="bg-white rounded-xl shadow p-4 text-center">
                    <p class="text-sm text-gray-500 mb-1" th:text="${#temporals.format(dia.fecha, 'dd/MM')}"></p>
                    <p class="text-2xl font-bold text-green-800" th:text="${dia.tempMax} + '°C'"></p>
                    <p class="text-xs text-gray-400" th:text="'Min: ' + ${dia.tempMin} + '°C'"></p>
                    <p class="text-xs text-blue-500 mt-1" th:text="'Lluvia: ' + ${dia.lluvia} + ' mm'"></p>
                    <p class="text-xs text-teal-500" th:text="'Humedad: ' + ${dia.humedad} + '%'"></p>
                </div>
            </div>
        </div>

        <!-- Resumen de cultivos del agricultor -->
        <h3 class="text-lg font-semibold text-gray-700 mb-3">Mis Cultivos</h3>
        <div th:if="${#lists.isEmpty(cultivos)}" class="text-gray-500 text-sm">
            No tienes cultivos registrados aún.
            <a th:href="@{/cultivos/nuevo}" class="text-green-700 hover:underline ml-1">Registra uno</a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4" th:if="${not #lists.isEmpty(cultivos)}">
            <div th:each="c : ${cultivos}" class="bg-white rounded-xl shadow p-4">
                <p class="font-bold text-green-900" th:text="${c.nombreCultivo}"></p>
                <p class="text-sm text-gray-500" th:text="${c.municipio}"></p>
                <span th:if="${c.categoria == 'TRANSITORIO'}"
                    class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded">TRANSITORIO</span>
                <span th:if="${c.categoria == 'PERMANENTE'}"
                    class="bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded">PERMANENTE</span>
            </div>
        </div>
    </main>
</body>

</html>
