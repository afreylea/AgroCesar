# ── Servidor ────────────────────────────────────────────────────────────────
server.port=8080
spring.application.name=agrocesar

# ── Perfil activo (carga application-local.properties con credenciales Oracle)
spring.profiles.active=local

# ── Forzar Tomcat (evita conflicto WebFlux/MVC) ─────────────────────────────
spring.main.web-application-type=servlet

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Spring Security (deshabilita el usuario por defecto de Boot) ─────────────
#spring.security.user.name=
#spring.security.user.password=

# ── WebClient Open-Meteo ─────────────────────────────────────────────────────
webclient.open-meteo.base-url=https://api.open-meteo.com
webclient.open-meteo.timeout-seconds=10

# ── Scheduler ────────────────────────────────────────────────────────────────
spring.task.scheduling.pool.size=2

# ── Logs ─────────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.com.agrocesar=DEBUG
logging.level.org.jdbi=WARN

# ── Errors ───────────────────────────────────────────────────────────────────
server.error.include-message=always
server.error.include-stacktrace=always

[5:16 p. m., 31/5/2026] Ayner: # Ruta absoluta en disco donde se almacenan las imagenes subidas por el admin
app.imagenes.ruta=C:/agrocesar/imagenes/

# URL publica con la que Spring sirve las imagenes al navegador
app.imagenes.url=/imagenes/

# Tamano maximo permitido por archivo en subidas multipart
spring.servlet.multipart.max-file-size=20MB

# Tamano maximo total de la peticion multipart (archivo + campos del formulario)
spring.servlet.multipart.max-request-size=22MB

# Tamano maximo que Tomcat acepta en el cuerpo de una peticion antes de rechazarla
server.tomcat.max-swallow-size=22MB

# Numero maximo de parametros en una peticion (formularios grandes)
server.tomcat.max-parameter-count=500

# Numero maximo de partes en una peticion multipart
server.tomcat.max-part-count=100