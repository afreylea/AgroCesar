<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: base('Mis Cultivos - Agrocesar', ~{::main})"></head>

<body>
    <main>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-green-900">Mis Cultivos</h2>
            <a th:href="@{/cultivos/nuevo}"
                class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-600 transition">
                + Nuevo Cultivo
            </a>
        </div>

        <!-- Mensaje de éxito / error (flash attributes del Controller) -->
        <div th:if="${exito}" class="bg-green-100 text-green-800 px-4 py-2 rounded mb-4 text-sm" th:text="${exito}">
        </div>
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm" th:text="${error}"></div>

        <!-- Estado vacío: visible solo si la lista está vacía -->
        <div th:if="${#lists.isEmpty(cultivos)}" class="text-center text-gray-500 py-12">
            <p class="text-lg">Aún no tienes cultivos registrados.</p>
            <a th:href="@{/cultivos/nuevo}" class="text-green-700 hover:underline mt-2 block">
                Registra tu primer cultivo
            </a>
        </div>

        <!-- Tabla de cultivos — visible solo si hay datos -->
        <div th:if="${not #lists.isEmpty(cultivos)}">
            <table class="w-full text-sm text-left text-gray-700 border border-gray-200 rounded-lg">
                <thead class="bg-green-900 text-white">
                    <tr>
                        <th class="px-4 py-3">Cultivo</th>
                        <th class="px-4 py-3">Categoría</th>
                        <th class="px-4 py-3">Municipio</th>
                        <th class="px-4 py-3">Hectáreas</th>
                        <th class="px-4 py-3">Fecha Siembra</th>
                        <th class="px-4 py-3">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- th:each itera la lista de cultivos del modelo -->
                    <tr th:each="c : ${cultivos}" class="border-t hover:bg-gray-50">
                        <td class="px-4 py-3" th:text="${c.nombreCultivo}"></td>
                        <!-- Badge de categoría con color diferenciado -->
                        <td class="px-4 py-3">
                            <span th:if="${c.categoria == 'TRANSITORIO'}"
                                class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded">
                                TRANSITORIO
                            </span>
                            <span th:if="${c.categoria == 'PERMANENTE'}"
                                class="bg-amber-100 text-amber-800 text-xs font-medium px-2.5 py-0.5 rounded">
                                PERMANENTE
                            </span>
                        </td>
                        <td class="px-4 py-3" th:text="${c.municipio}"></td>
                        <td class="px-4 py-3" th:text="${c.hectareas}"></td>
                        <td class="px-4 py-3" th:text="${#temporals.format(c.fechaSiembra, 'dd/MM/yyyy')}"></td>
                        <td class="px-4 py-3">
                            <!-- Eliminar: usa POST con token CSRF — Alpine controla el modal -->
                            <div x-data="{ confirmar: false }">
                                <button @click="confirmar = true"
                                    class="text-red-600 hover:underline text-sm">Eliminar</button>
                                <div x-show="confirmar"
                                    class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
                                    <div class="bg-white rounded-xl p-6 shadow-xl max-w-sm w-full">
                                        <p class="text-gray-700 mb-4">¿Confirmas la eliminación de este cultivo?</p>
                                        <div class="flex gap-3 justify-end">
                                            <button @click="confirmar = false"
                                                class="px-4 py-2 rounded bg-gray-200 hover:bg-gray-300">Cancelar</button>
                                            <form th:action="@{/cultivos/{id}/eliminar(id=${c.id})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}"
                                                    th:value="${_csrf.token}">
                                                <button type="submit"
                                                    class="px-4 py-2 rounded bg-red-600 text-white hover:bg-red-700">
                                                    Confirmar
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>

</html>
