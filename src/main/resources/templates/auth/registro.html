<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-auth :: base('Registro - Agrocesar', ~{::div})}">

<body>
    <div class="relative" x-data="{ 
        contrasena: '', 
        confirmacion: '', 
        tocadoConfirmacion: false,
        mostrarPass: false,
        mostrarConfirm: false 
    }">


        <!-- Logo flotante - burbuja del mismo tamaño, logo más grande -->
        <div class="absolute -top-14 left-1/2 transform -translate-x-1/2 z-10">
            <div
                class="bg-white rounded-full p-3 shadow-xl border-4 border-green-100 w-28 h-28 flex items-center justify-center">
                <img th:src="@{~/images/logo-agrocesar.png}" alt="Logo" class="h-16 w-16 object-contain">
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8 pt-24 w-full max-w-md">

            <h1 class="text-2xl font-bold text-green-900 text-center mb-2">
                Crear cuenta
            </h1>

            <!-- Separador decorativo con maíz -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="h-px w-12 bg-green-200"></div>

                <!-- Icono de maíz -->
                <svg class="w-7 h-7 text-yellow-500" viewBox="0 0 24 24" fill="currentColor"
                    xmlns="http://www.w3.org/2000/svg">
                    <!-- Hoja izquierda -->
                    <path d="M12 14 Q6 12 4 16 Q8 15 12 14" fill="#16a34a" />
                    <!-- Hoja derecha -->
                    <path d="M12 14 Q18 12 20 16 Q16 15 12 14" fill="#16a34a" />
                    <!-- Hoja inferior -->
                    <path d="M12 16 Q8 18 6 20 Q10 18 12 16" fill="#16a34a" />
                    <!-- Mazorca -->
                    <ellipse cx="12" cy="8" rx="4" ry="7" fill="#eab308" />
                    <!-- Granos -->
                    <circle cx="10" cy="5" r="1.2" fill="#facc15" />
                    <circle cx="12" cy="4.5" r="1.2" fill="#facc15" />
                    <circle cx="14" cy="5" r="1.2" fill="#facc15" />
                    <circle cx="9" cy="7" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="6.5" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="6.5" r="1.2" fill="#facc15" />
                    <circle cx="15" cy="7" r="1.2" fill="#facc15" />
                    <circle cx="9" cy="9" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="8.5" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="8.5" r="1.2" fill="#facc15" />
                    <circle cx="15" cy="9" r="1.2" fill="#facc15" />
                    <circle cx="10" cy="11" r="1.2" fill="#facc15" />
                    <circle cx="12" cy="10.5" r="1.2" fill="#facc15" />
                    <circle cx="14" cy="11" r="1.2" fill="#facc15" />
                    <circle cx="11" cy="13" r="1.2" fill="#facc15" />
                    <circle cx="13" cy="13" r="1.2" fill="#facc15" />
                    <!-- Tallo -->
                    <rect x="11" y="14" width="2" height="6" fill="#16a34a" />
                </svg>

                <div class="h-px w-12 bg-green-200"></div>
            </div>

            <div th:if="${error}"
                class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span th:text="${error}">Error al registrar</span>
            </div>

            <form th:action="@{/registro}" method="post" class="space-y-5"
                @submit.prevent="if(contrasena === confirmacion && contrasena.length >= 8) { $el.submit() }">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"
                    th:if="${_csrf != null}">

                <!-- Nombre -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nombre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" name="nombre" required minlength="2" placeholder="Ingresa tu nombre"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <!-- Apellido -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Apellido</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <input type="text" name="apellido" required minlength="2" placeholder="Ingresa tu apellido"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <!-- Correo electrónico -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <input type="email" name="email" required placeholder="ejemplo@correo.com"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input :type="mostrarPass ? 'text' : 'password'" name="password" required minlength="8"
                            x-model="contrasena" placeholder="Crea una contraseña"
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                        <!-- UN SOLO OJO que cambia -->
                        <button type="button" @click="mostrarPass = !mostrarPass"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
                            <svg x-show="!mostrarPass" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="mostrarPass" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input :type="mostrarConfirm ? 'text' : 'password'" required x-model="confirmacion"
                            @blur="tocadoConfirmacion = true" placeholder="Confirma tu contraseña"
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                        <!-- UN SOLO OJO que cambia -->
                        <button type="button" @click="mostrarConfirm = !mostrarConfirm"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
                            <svg x-show="!mostrarConfirm" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="mostrarConfirm" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                    <p x-show="tocadoConfirmacion && confirmacion.length > 0 && contrasena !== confirmacion"
                        class="text-red-500 text-xs mt-2 flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Las contraseñas no coinciden
                    </p>
                </div>

                <!-- Municipio -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Municipio de residencia</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                        <select name="municipioId" required
                            class="w-full pl-10 pr-10 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white appearance-none cursor-pointer">
                            <option value="">Selecciona tu municipio</option>
                            <option th:each="municipio : ${municipios}" th:value="${municipio.id}"
                                th:text="${municipio.nombre}">
                            </option>
                        </select>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>
                    </div>
                </div>

                <button type="submit" :disabled="contrasena !== confirmacion || contrasena.length < 8"
                    class="w-full bg-green-900 text-white py-3 rounded-xl hover:bg-green-800 font-semibold transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
                    Crear cuenta
                </button>

                <p class="text-center text-sm text-gray-500">
                    ¿Ya tienes cuenta?
                    <a th:href="@{/login}"
                        class="text-green-700 hover:text-green-800 font-semibold hover:underline">Inicia sesión</a>
                </p>

            </form>
        </div>
    </div>
</body>

</html>
