<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: base('Catálogo - Admin Agrocesar', ~{::main})"></head>

<body>
    <main>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-green-900">Catálogo de Cultivos</h2>
            <!-- Botón que abre el modal de nuevo cultivo con Alpine -->
            <button @click="$dispatch('open-modal')"
                class="bg-green-700 text-white px-4 py-2 rounded-lg hover:bg-green-600">
                + Nuevo Cultivo
            </button>
        </div>

        <div th:if="${exito}" class="bg-green-100 text-green-800 px-4 py-2 rounded mb-4 text-sm" th:text="${exito}">
        </div>
        <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm" th:text="${error}"></div>

        <!-- Tabla del catálogo -->
        <table class="w-full text-sm text-left text-gray-700 border border-gray-200 rounded-lg">
            <thead class="bg-green-900 text-white">
                <tr>
                    <th class="px-4 py-3">Nombre</th>
                    <th class="px-4 py-3">Categoría</th>
                    <th class="px-4 py-3">Temp Min/Max</th>
                    <th class="px-4 py-3">Lluvia Min/Max</th>
                    <th class="px-4 py-3">Humedad Min/Max</th>
                    <th class="px-4 py-3">Estado</th>
                    <th class="px-4 py-3">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${catalogo}" class="border-t hover:bg-gray-50">
                    <td class="px-4 py-3 font-medium" th:text="${c.nombre}"></td>
                    <td class="px-4 py-3">
                        <span th:if="${c.categoria == 'TRANSITORIO'}"
                            class="bg-blue-100 text-blue-800 text-xs font-medium px-2.5 py-0.5 rounded">
                            TRANSITORIO</span>
                        <span th:if="${c.categoria == 'PERMANENTE'}"
                            class="bg-amber-100 text-amber-800 text-xs font-medium px-2.5 py-0.5 rounded">
                            PERMANENTE</span>
                    </td>
                    <td class="px-4 py-3" th:text="${c.tempMin} + '°C / ' + ${c.tempMax} + '°C'"></td>
                    <td class="px-4 py-3" th:text="${c.lluviaMin} + ' / ' + ${c.lluviaMax} + ' mm'"></td>
                    <td class="px-4 py-3" th:text="${c.humedadMin} + '% / ' + ${c.humedadMax} + '%'"></td>
                    <td class="px-4 py-3">
                        <span th:if="${c.activo == 1}"
                            class="bg-green-100 text-green-800 text-xs px-2.5 py-0.5 rounded">Activo</span>
                        <span th:if="${c.activo == 0}"
                            class="bg-gray-100 text-gray-600 text-xs px-2.5 py-0.5 rounded">Inactivo</span>
                    </td>
                    <td class="px-4 py-3">
                        <a th:href="@{/admin/catalogo/{id}/editar(id=${c.id})}"
                            class="text-green-700 hover:underline text-sm mr-3">Editar</a>
                        <form th:action="@{/admin/catalogo/{id}/desactivar(id=${c.id})}" method="post"
                            style="display:inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="text-red-600 hover:underline text-sm">Desactivar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>

</html>
