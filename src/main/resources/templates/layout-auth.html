<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="base(titulo, contenido)">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Agrocesar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Lato', 'sans-serif'] },
                },
            },
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js para los ojos de contraseña -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-100">

    <!-- HEADER -->
    <header class="bg-green-900 text-amber-100 px-6 py-4 shadow-md">
        <div class="max-w-7xl mx-auto flex items-center gap-5">
            <!-- Logo grande -->
            <img th:src="@{~/images/logo-agrocesar.png}" 
                 alt="Logo Agrocesar" 
                 class="h-20 w-auto object-contain drop-shadow-lg">
            <!-- Título -->
            <div class="leading-tight">
                <h1 class="text-2xl font-bold tracking-wide">Agrocesar</h1>
                <p class="text-sm text-green-300 font-light">Monitoreo de Cultivos</p>
            </div>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="flex-1 flex items-center justify-center p-6" th:insert="${contenido}">
    </main>

    <!-- FOOTER -->
    <footer class="bg-green-900 text-amber-200 text-center py-3 text-sm">
        Agrocesar - Sistema de Monitoreo de Cultivos y Alertas Climáticas &copy; | Cesar, Colombia
    </footer>

</body>

</html>
