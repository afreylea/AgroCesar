<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout-auth :: base('Nueva contraseña - Agrocesar', ~{::div})}">

<body>
    <div class="relative">

        <!-- Logo flotante -->
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 z-10">
            <div
                class="bg-white rounded-full p-3 shadow-xl border-4 border-green-100 w-28 h-28 flex items-center justify-center">
                <img th:src="@{~/images/logo-agrocesar.png}" alt="Logo" class="h-16 w-16 object-contain">
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8 pt-16 w-full max-w-md">

            <h1 class="text-2xl font-bold text-green-900 text-center mb-2">Nueva contraseña</h1>

            <!-- Separador decorativo -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="h-px w-12 bg-green-200"></div>
                <div class="w-7 h-7 bg-green-50 rounded-full border border-green-200 flex items-center justify-center">
                    <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                </div>
                <div class="h-px w-12 bg-green-200"></div>
            </div>

            <p class="text-center text-sm text-gray-500 mb-6">
                Elige una contraseña segura de al menos 8 caracteres.
            </p>

            <!-- Error -->
            <div th:if="${error}"
                class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span th:text="${error}"></span>
            </div>

            <!-- Formulario -->
            <form th:action="@{/reset-password}" method="post" class="space-y-5" x-data="{ pass: '', confirm: '', showPass: false, showConfirm: false,
                             get coinciden() { return this.pass.length >= 8 && this.pass === this.confirm; },
                             get fortaleza() {
                                 if (this.pass.length === 0) return 0;
                                 let s = 0;
                                 if (this.pass.length >= 8) s++;
                                 if (/[A-Z]/.test(this.pass)) s++;
                                 if (/[0-9]/.test(this.pass)) s++;
                                 if (/[^A-Za-z0-9]/.test(this.pass)) s++;
                                 return s;
                             },
                             get labelFortaleza() {
                                 return ['','Débil','Regular','Buena','Fuerte'][this.fortaleza];
                             },
                             get colorFortaleza() {
                                 return ['','bg-red-400','bg-amber-400','bg-blue-400','bg-green-500'][this.fortaleza];
                             }
                           }">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="token" th:value="${token}" />

                <!-- Nueva contraseña -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nueva contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                            </svg>
                        </div>
                        <input :type="showPass ? 'text' : 'password'" name="password" required minlength="8"
                            placeholder="Mínimo 8 caracteres" x-model="pass"
                            class="w-full pl-10 pr-12 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                        <button type="button" @click="showPass = !showPass"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg x-show="!showPass" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="showPass" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>

                    <!-- Indicador fortaleza -->
                    <div x-show="pass.length > 0" class="mt-2">
                        <div class="flex gap-1 mb-1">
                            <div class="flex-1 h-1 rounded-full bg-gray-100 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300"
                                    :class="fortaleza >= 1 ? colorFortaleza : ''"
                                    :style="fortaleza >= 1 ? 'width:100%' : 'width:0'"></div>
                            </div>
                            <div class="flex-1 h-1 rounded-full bg-gray-100 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300"
                                    :class="fortaleza >= 2 ? colorFortaleza : ''"
                                    :style="fortaleza >= 2 ? 'width:100%' : 'width:0'"></div>
                            </div>
                            <div class="flex-1 h-1 rounded-full bg-gray-100 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300"
                                    :class="fortaleza >= 3 ? colorFortaleza : ''"
                                    :style="fortaleza >= 3 ? 'width:100%' : 'width:0'"></div>
                            </div>
                            <div class="flex-1 h-1 rounded-full bg-gray-100 overflow-hidden">
                                <div class="h-full rounded-full transition-all duration-300"
                                    :class="fortaleza >= 4 ? colorFortaleza : ''"
                                    :style="fortaleza >= 4 ? 'width:100%' : 'width:0'"></div>
                            </div>
                        </div>
                        <p class="text-xs font-medium" :class="{
                               'text-red-500':   fortaleza === 1,
                               'text-amber-500': fortaleza === 2,
                               'text-blue-500':  fortaleza === 3,
                               'text-green-600': fortaleza === 4
                           }" x-text="'Contraseña ' + labelFortaleza"></p>
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirmar contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                            </svg>
                        </div>
                        <input :type="showConfirm ? 'text' : 'password'" name="confirmPassword" required minlength="8"
                            placeholder="Repite tu contraseña" x-model="confirm"
                            :class="confirm.length > 0 ? (coinciden ? 'border-green-400 focus:ring-green-500' : 'border-red-300 focus:ring-red-400') : 'border-gray-200 focus:ring-green-500'"
                            class="w-full pl-10 pr-12 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:border-transparent transition bg-gray-50 focus:bg-white">
                        <button type="button" @click="showConfirm = !showConfirm"
                            class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg x-show="!showConfirm" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                            </svg>
                            <svg x-show="showConfirm" class="h-5 w-5 text-gray-400 hover:text-gray-600" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                            </svg>
                        </button>
                    </div>
                    <p x-show="confirm.length > 0 && !coinciden"
                        class="text-xs text-red-500 mt-1.5 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Las contraseñas no coinciden
                    </p>
                    <p x-show="coinciden" class="text-xs text-green-600 mt-1.5 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Las contraseñas coinciden
                    </p>
                </div>

                <button type="submit" :disabled="!coinciden"
                    :class="coinciden ? 'bg-green-900 hover:bg-green-800 cursor-pointer shadow-lg hover:shadow-xl transform hover:-translate-y-0.5' : 'bg-gray-300 cursor-not-allowed'"
                    class="w-full text-white py-3 rounded-xl font-semibold transition">
                    Cambiar contraseña
                </button>
            </form>

            <!-- Volver -->
            <p class="text-center text-sm text-gray-500 mt-5">
                <a href="/login"
                    class="text-green-700 hover:text-green-800 font-medium flex items-center justify-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Volver al login
                </a>
            </p>
        </div>
    </div>
</body>

</html>
