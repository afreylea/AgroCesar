<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: base('Nuevo Cultivo - Agrocesar', ~{::main})"></head>

<body>
    <main>
        <div class="max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-green-900 mb-6">Registrar Cultivo</h2>

            <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm" th:text="${error}">
            </div>

            <form th:action="@{/cultivos/nuevo}" th:object="${cultivo}" method="post"
                class="bg-white rounded-xl shadow p-6 space-y-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Selector de tipo de cultivo desde el catálogo -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Cultivo</label>
                    <select th:field="*{catalogoId}" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-600 focus:outline-none">
                        <option value="">Selecciona un cultivo</option>
                        <option th:each="c : ${catalogo}" th:value="${c.id}" th:text="${c.nombre}"></option>
                    </select>
                </div>

                <!-- Selector de municipio -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Municipio</label>
                    <select th:field="*{municipioId}" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-600 focus:outline-none">
                        <option value="">Selecciona un municipio</option>
                        <option th:each="m : ${municipios}" th:value="${m.id}" th:text="${m.nombre}"></option>
                    </select>
                </div>

                <!-- Hectáreas -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Hectáreas</label>
                    <input type="number" th:field="*{hectareas}" step="0.1" min="0.1" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-600 focus:outline-none">
                </div>

                <!-- Fecha de siembra -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Siembra</label>
                    <input type="date" th:field="*{fechaSiembra}" required
                        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-600 focus:outline-none">
                </div>

                <div class="flex gap-3 justify-end pt-2">
                    <a th:href="@{/cultivos}"
                        class="px-4 py-2 rounded-lg bg-gray-200 hover:bg-gray-300 text-gray-700">Cancelar</a>
                    <button type="submit"
                        class="px-4 py-2 rounded-lg bg-green-700 text-white hover:bg-green-600 font-semibold">
                        Registrar
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
