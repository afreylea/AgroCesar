<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout-auth :: base('Recuperar contraseña - Agrocesar', ~{::div})}">

<body>
    <div class="relative">

        <!-- Logo flotante -->
        <div class="absolute -top-12 left-1/2 transform -translate-x-1/2 z-10">
            <div
                class="bg-white rounded-full p-3 shadow-xl border-4 border-green-100 w-28 h-28 flex items-center justify-center">
                <img th:src="@{~/images/logo-agrocesar.png}" alt="Logo" class="h-16 w-16 object-contain">
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8 pt-16 w-full max-w-md">

            <h1 class="text-2xl font-bold text-green-900 text-center mb-2">Recuperar contraseña</h1>

            <!-- Separador decorativo -->
            <div class="flex items-center justify-center gap-3 mb-6">
                <div class="h-px w-12 bg-green-200"></div>
                <div class="w-7 h-7 bg-green-50 rounded-full border border-green-200 flex items-center justify-center">
                    <svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                </div>
                <div class="h-px w-12 bg-green-200"></div>
            </div>

            <p class="text-center text-sm text-gray-500 mb-6">
                Ingresa tu correo y te enviaremos un enlace seguro para restablecer tu contraseña.
            </p>

            <!-- Mensaje éxito -->
            <div th:if="${mensaje}"
                class="bg-green-50 text-green-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span th:text="${mensaje}"></span>
            </div>

            <!-- Mensaje error -->
            <div th:if="${error}"
                class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span th:text="${error}"></span>
            </div>

            <!-- Formulario -->
            <form th:action="@{/forgot-password}" method="post" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Correo electrónico</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                            </svg>
                        </div>
                        <input type="email" name="email" required placeholder="ejemplo@correo.com"
                            class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition bg-gray-50 focus:bg-white">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-green-900 text-white py-3 rounded-xl hover:bg-green-800 font-semibold transition shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                    Enviar enlace
                </button>
            </form>

            <!-- Info seguridad -->
            <div class="mt-5 flex items-start gap-3 bg-green-50 border border-green-100 rounded-xl px-4 py-3">
                <svg class="w-4 h-4 text-green-600 shrink-0 mt-0.5" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                <div>
                    <p class="text-xs font-semibold text-green-800">Tu seguridad es nuestra prioridad</p>
                    <p class="text-xs text-green-600/80 mt-0.5">El enlace que recibirás tendrá una validez limitada y
                        solo podrá usarse una vez.</p>
                </div>
            </div>

            <!-- Volver -->
            <p class="text-center text-sm text-gray-500 mt-5">
                <a href="/login"
                    class="text-green-700 hover:text-green-800 font-medium flex items-center justify-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                    </svg>
                    Volver al login
                </a>
            </p>
        </div>
    </div>
</body>

</html>
