<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout-auth :: base('Registro - AgroCesar', ~{::main})}"></head>

<body>
    <main>
        <div class="min-h-screen flex items-center justify-center bg-gray-50 py-8">
            <div class="bg-white rounded-xl shadow-md p-8 w-full max-w-lg">

                <h1 class="text-2xl font-bold text-green-900 text-center mb-6">
                    Crear cuenta
                </h1>

                <!-- Mensaje de error general del servidor -->
                <div th:if="${error}" class="bg-red-100 text-red-700 px-4 py-2 rounded mb-4 text-sm">
                    <span th:text="${error}">Error al registrar</span>
                </div>

                <!-- Alpine.js: x-data define el estado local del componente -->
                <!-- guardamos contrasena y confirmacion para validar antes de enviar -->
                <form th:action="@{/registro}" method="post" class="space-y-4"
                    x-data="{ contrasena: '', confirmacion: '', enviado: false }"
                    @submit.prevent="if(contrasena === confirmacion) { enviado = true; $el.submit() }">

                    <!-- Token CSRF requerido por Spring Security 7 en todo POST -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <!-- Campo nombre completo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Nombre completo
                        </label>
                        <input type="text" name="nombre" required minlength="3" class="w-full border border-gray-300 rounded-lg px-3 py-2
                                      focus:ring-2 focus:ring-green-600 focus:outline-none">
                    </div>

                    <!-- Campo correo electronico -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Correo electronico
                        </label>
                        <input type="email" name="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2
                                      focus:ring-2 focus:ring-green-600 focus:outline-none">
                    </div>

                    <!-- Campo contrasena - x-model enlaza el valor al estado Alpine -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Contrasena
                        </label>
                        <input type="password" name="password" required minlength="8" x-model="contrasena" class="w-full border border-gray-300 rounded-lg px-3 py-2
                                      focus:ring-2 focus:ring-green-600 focus:outline-none">
                    </div>

                    <!-- Confirmacion de contrasena con validacion Alpine en tiempo real -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Confirmar contrasena
                        </label>
                        <input type="password" required x-model="confirmacion" class="w-full border border-gray-300 rounded-lg px-3 py-2
                                      focus:ring-2 focus:ring-green-600 focus:outline-none">
                        <!-- Mensaje visible solo si las contrasenas no coinciden -->
                        <p x-show="confirmacion.length > 0 && contrasena !== confirmacion"
                            class="text-red-500 text-xs mt-1">
                            Las contrasenas no coinciden
                        </p>
                    </div>

                    <!-- Selector de municipio - datos cargados desde el modelo Spring MVC -->
                    <!-- El controlador agrega la lista como model.addAttribute('municipios', lista) -->
                    <!-- th:each itera la lista y genera un option por municipio -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">
                            Municipio de residencia
                        </label>
                        <select name="municipioId" required class="w-full border border-gray-300 rounded-lg px-3 py-2
                                       focus:ring-2 focus:ring-green-600 focus:outline-none">
                            <option value="">Selecciona tu municipio</option>
                            <!-- municipio es cada elemento de la lista del modelo -->
                            <option th:each="municipio : ${municipios}" th:value="${municipio.id}"
                                th:text="${municipio.nombre}">
                            </option>
                        </select>
                    </div>

                    <!-- Boton deshabilitado si las contrasenas no coinciden -->
                    <button type="submit" :disabled="contrasena !== confirmacion || contrasena.length < 8" class="w-full bg-green-900 text-amber-100 py-2 rounded-lg
                                   hover:bg-green-800 font-semibold transition
                                   disabled:opacity-50 disabled:cursor-not-allowed">
                        Crear cuenta
                    </button>

                    <p class="text-center text-sm text-gray-500">
                        Ya tienes cuenta?
                        <a th:href="@{/login}" class="text-green-700 hover:underline">
                            Inicia sesion
                        </a>
                    </p>

                </form>
            </div>
        </div>
    </main>
</body>

</html>
