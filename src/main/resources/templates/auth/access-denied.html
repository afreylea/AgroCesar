<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: base('Acceso Denegado - Agrocesar', ~{::main})}">

<body>
<main class="flex items-center justify-center flex-1">

    <div class="text-center max-w-md mx-auto px-6">

        <!-- Icono -->
        <div class="w-24 h-24 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-12 h-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                    d="M12 15v2m0 0v2m0-2h2m-2 0H10m2-6V9m0 0V7m0 2h2M12 9h-2m9.364 9.364l-1.414-1.414M19.364 4.636l-1.414 1.414M4.636 19.364l1.414-1.414M4.636 4.636l1.414 1.414M21 12h-2m-14 0H3m16.364-7.364A9 9 0 1 1 4.636 19.364 9 9 0 0 1 19.364 4.636z"/>
            </svg>
        </div>

        <!-- Codigo -->
        <p class="text-6xl font-black text-red-100 mb-2 select-none">403</p>

        <!-- Titulo -->
        <h2 class="text-2xl font-black text-gray-900 mb-3">Acceso Denegado</h2>

        <!-- Descripcion -->
        <p class="text-gray-500 text-sm mb-8 leading-relaxed">
            No tienes permisos para acceder a esta pagina.
            Si crees que esto es un error, contacta al administrador del sistema.
        </p>

        <!-- Acciones -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a th:href="@{/dashboard}"
               class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-green-700 hover:bg-green-800 text-white text-sm font-semibold transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Ir al Dashboard
            </a>
            <a th:href="@{/logout}"
               class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                Cerrar Sesion
            </a>
        </div>

        <!-- Separador -->
        <div class="mt-10 pt-6 border-t border-gray-100">
            <div class="flex items-center justify-center gap-2 text-xs text-gray-400">
                <div class="w-1.5 h-1.5 bg-green-400 rounded-full"></div>
                <span>Agrocesar — Sistema de Monitoreo de Cultivos</span>
            </div>
        </div>

    </div>

</main>
</body>
</html>
