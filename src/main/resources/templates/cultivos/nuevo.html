<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: base('Registrar Cultivo - Agrocesar', ~{::main})}">

<body>
    <main class ="h-full">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a th:href="@{/cultivos}"
                    class="w-9 h-9 rounded-full bg-white shadow border border-gray-200 flex items-center justify-center hover:bg-gray-50 transition text-gray-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <div>
                    <h2 class="text-2xl font-bold text-green-900">Registrar Cultivo</h2>
                    <p class="text-gray-500 text-sm">Añade un nuevo cultivo para comenzar a monitorearlo.</p>
                </div>
            </div>
        </div>

        <!-- Error -->
        <div th:if="${error}"
            class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl mb-5 text-sm flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span th:text="${error}"></span>
        </div>

        <!-- Card del formulario -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">

            <!-- Banner verde superior -->
            <div class="bg-gradient-to-r from-green-800 to-green-600 px-8 py-5 flex items-center gap-4">
                <div class="w-12 h-12 bg-white bg-opacity-20 rounded-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" />
                    </svg>
                </div>
                <div>
                    <p class="text-white font-semibold text-lg">Información del Cultivo</p>
                    <p class="text-green-200 text-sm">Completa los datos para registrar tu cultivo</p>
                </div>
            </div>

            <!-- Formulario -->
            <form th:action="@{/cultivos/nuevo}" th:object="${cultivo}" method="post" class="p-8 space-y-6">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Fila 1: Cultivo + Municipio -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Tipo de Cultivo <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div
                                class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-green-50 rounded-lg flex items-center justify-center pointer-events-none">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064" />
                                </svg>
                            </div>
                            <select th:field="*{catalogoId}" required
                                class="w-full pl-14 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:outline-none appearance-none bg-white text-gray-700 hover:border-gray-300 transition cursor-pointer">
                                <option value="">Selecciona un cultivo</option>
                                <option th:each="c : ${catalogo}" th:value="${c.id}" th:text="${c.nombre}"></option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Municipio <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div
                                class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-green-50 rounded-lg flex items-center justify-center pointer-events-none">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </div>
                            <select th:field="*{municipioId}" required
                                class="w-full pl-14 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:outline-none appearance-none bg-white text-gray-700 hover:border-gray-300 transition cursor-pointer">
                                <option value="">Selecciona un municipio</option>
                                <option th:each="m : ${municipios}" th:value="${m.id}" th:text="${m.nombre}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Fila 2: Hectáreas + Fecha -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Hectáreas <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div
                                class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-green-50 rounded-lg flex items-center justify-center pointer-events-none">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                                </svg>
                            </div>
                            <input type="number" th:field="*{hectareas}" step="0.1" min="0.1" required
                                placeholder="Ej: 2.5"
                                class="w-full pl-14 pr-12 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:outline-none text-gray-700 placeholder-gray-400 hover:border-gray-300 transition">
                            <span
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm font-medium">ha</span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Fecha de Siembra <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div
                                class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 bg-green-50 rounded-lg flex items-center justify-center pointer-events-none">
                                <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <input type="date" th:field="*{fechaSiembra}" required
                                class="w-full pl-14 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 focus:outline-none text-gray-700 hover:border-gray-300 transition">
                        </div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="flex gap-3 justify-end pt-2 border-t border-gray-100">
                    <a th:href="@{/cultivos}"
                        class="px-6 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium flex items-center gap-2 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Cancelar
                    </a>
                    <button type="submit"
                        class="px-6 py-3 rounded-xl bg-green-700 hover:bg-green-800 text-white font-semibold flex items-center gap-2 transition shadow-sm">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Registrar Cultivo
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
